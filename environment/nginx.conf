server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas limpias de React Router (VITE_ROUTER_MODE=browser)
    location / {
        try_files $uri /index.html;
    }

    # Los archivos de Vite llevan hash en el nombre: se pueden cachear sin miedo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
